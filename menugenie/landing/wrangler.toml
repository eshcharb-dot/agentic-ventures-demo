# Landing Worker — extracted from the deployed bundle and patched.
#
# ROUTES ARE DELIBERATELY OMITTED. Cloudflare treats the Wrangler config as the
# source of truth for routes: declaring the wrong ones would detach
# menu-genie.com, but omitting them entirely leaves the dashboard-configured
# routes untouched. Do not add a `routes` key unless you are mirroring exactly
# what the dashboard already has.
#
# The Worker name below MUST match the Worker name in the Cloudflare dashboard
# or a Workers Builds deploy fails.

name = "menu-genie-landing"
main = "src/index.js"
compatibility_date = "2026-09-01"
